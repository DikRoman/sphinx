<div class="view-panel active" id="inboxView">
    <div class="view-header">
        <div>
            <h1><i class="fas fa-inbox"></i> Inbox</h1>
            <p class="view-subtitle">Быстрый захват задач и идей</p>
        </div>
        <div class="view-header-actions">
            <button class="btn-secondary" id="inboxColumnsSettings" title="Настроить колонки">
                <i class="fas fa-columns"></i> Колонки
            </button>
            <button class="btn-primary" id="quickAddTask">
                <i class="fas fa-plus"></i> Быстро добавить
            </button>
        </div>
    </div>
    <div class="kanban-board" id="inboxKanban">
        <!-- Колонки создаются из настроек (Kanban) -->
    </div>
</div>
