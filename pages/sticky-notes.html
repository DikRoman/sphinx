<div class="view-panel active" id="stickyNotesView">
    <div class="sticky-block-header" id="stickyBlockHeader">
        <button class="sticky-header-tab" id="stickyHeaderTab" title="Скрыть / Показать название">
            <i class="fas fa-chevron-up"></i>
        </button>
        <div class="view-header sticky-view-header" id="stickyViewHeader">
            <div>
                <h1><i class="fas fa-thumbtack"></i> Стикеры</h1>
                <p class="view-subtitle">Перетаскиваемые цветные заметки</p>
            </div>
            <div class="header-actions">
                <div class="sticky-bg-picker" title="Цвет фона доски">
                    <button type="button" class="sticky-bg-btn active" data-bg="dark" id="stickyBgDark" style="background:#121212;" title="Тёмный"></button>
                    <button type="button" class="sticky-bg-btn" data-bg="light" id="stickyBgLight" style="background:#f5f3ef;" title="Светлый"></button>
                    <button type="button" class="sticky-bg-btn" data-bg="sandy" id="stickyBgSandy" style="background:#e8e2d4;" title="Песочный"></button>
                </div>
            </div>
        </div>
    </div>
    <div class="sticky-notes-toolbar">
        <div class="toolbar-group">
            <button class="toolbar-btn" id="addStickyNote" title="Добавить стикер">
                <i class="fas fa-sticky-note"></i>
                <span>Стикер</span>
            </button>
            <button class="toolbar-btn" id="addShape" title="Добавить фигуру">
                <i class="fas fa-square"></i>
                <span>Фигура</span>
            </button>
        </div>
        <div class="toolbar-group">
            <button class="toolbar-btn" id="stickyZoomOut" title="Уменьшить">
                <i class="fas fa-search-minus"></i>
            </button>
            <span class="toolbar-zoom-level" id="stickyZoomLevel">100%</span>
            <button class="toolbar-btn" id="stickyZoomIn" title="Увеличить">
                <i class="fas fa-search-plus"></i>
            </button>
            <button class="toolbar-btn" id="stickyZoomReset" title="Сбросить">
                <i class="fas fa-expand-arrows-alt"></i>
            </button>
        </div>
    </div>
    <div class="sticky-notes-container" id="stickyNotesContainer"></div>
</div>
