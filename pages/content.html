<div class="view-panel active" id="contentView">
    <div class="view-header">
        <div>
            <h1><i class="fas fa-film"></i> Контент библиотека</h1>
            <p class="view-subtitle">Фильмы, книги, сериалы</p>
        </div>
        <div class="header-actions">
            <button class="btn-secondary" id="filterContent"><i class="fas fa-filter"></i> Фильтр</button>
            <button class="btn-primary" id="addContent"><i class="fas fa-plus"></i> Добавить</button>
        </div>
    </div>
    <div class="content-tabs">
        <button class="tab-btn active" data-type="movies">Фильмы</button>
        <button class="tab-btn" data-type="books">Книги</button>
        <button class="tab-btn" data-type="series">Сериалы</button>
    </div>
    <div class="content-grid" id="contentGrid"></div>
</div>
