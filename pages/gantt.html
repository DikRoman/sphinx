<div class="view-panel active" id="ganttView">
    <div class="view-header">
        <div>
            <h1><i class="fas fa-chart-gantt"></i> Диаграмма Ганта</h1>
            <p class="view-subtitle">Временная шкала проектов</p>
        </div>
        <div class="header-actions">
            <select class="select-input" id="ganttProjectSelect">
                <option value="all">Все проекты</option>
            </select>
            <button class="btn-secondary" id="ganttZoomOut"><i class="fas fa-search-minus"></i></button>
            <button class="btn-secondary" id="ganttZoomIn"><i class="fas fa-search-plus"></i></button>
        </div>
    </div>
    <div class="gantt-container" id="ganttContainer"></div>
</div>
